name: universal-commerce-cms-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  directus:
    image: directus/directus:12.1.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18056:8055"
    environment:
      SECRET: ${DIRECTUS_SECRET}
      KEY: ${DIRECTUS_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_URL: http://127.0.0.1:18056
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EXTENSIONS_AUTO_RELOAD: "true"
      COMMERCE_ENABLE_ADDITIONAL_CODES: "false"
      COMMERCE_STOREFRONT_ENABLED: ${COMMERCE_STOREFRONT_ENABLED:-false}
      COMMERCE_STOREFRONT_USER_ID: ${COMMERCE_STOREFRONT_USER_ID:-}
      COMMERCE_STOREFRONT_PUBLIC_FOLDER_ID: ${COMMERCE_STOREFRONT_PUBLIC_FOLDER_ID:-}
    volumes:
      - directus-uploads:/directus/uploads
      - ../directus/extensions:/directus/extensions

volumes:
  postgres-data:
  directus-uploads:
