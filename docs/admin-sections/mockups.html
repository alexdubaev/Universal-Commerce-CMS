function field(f){const value=displayValue(f),locked=f.readonly||current.guarded||state==='forbidden',required=f.required?'<span class="req"> *</span>':'';const full=['text','json'].includes(f.type)||/description|content|message|comment|address|text|seo/.test(f.name);let ctl='';if(f.type==='boolean')ctl='<label class="checkrow"><input type="checkbox" '+(value?'checked ':'')+(locked?'disabled':'')+'>'+esc(titleOf(f))+'</label>';else if(f.choices?.length)ctl='<select '+(locked?'disabled':'')+'>'+f.choices.map(x=>'<option '+(String(value)===String(x)?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>';else if(f.type==='text'||f.type==='json'||/description|content|message|comment|address|text|summary|recommendation/.test(f.name))ctl='<textarea '+(locked?'readonly':'')+' placeholder="'+esc(f.type==='json'?'JSON-поле из схемы':'Введите '+titleOf(f).toLowerCase())+'">'+esc(value)+'</textarea>';else ctl='<input type="'+(f.type==='decimal'||f.type==='integer'?'number':'text')+'" value="'+esc(value)+'" placeholder="'+esc(f.relatedCollection?'Выбрать запись: '+f.relatedCollection:'Введите '+titleOf(f).toLowerCase())+'" '+(locked?'readonly':'')+'>';const hint=locked?'<div class="hint">Только просмотр · '+(state==='forbidden'?'нет права редактирования':current.guarded?'безопасная запись не подключена':f.hidden?'техническое поле схемы':'изменение закрыто текущим scope')+'</div>':f.relatedCollection?'<div class="hint">Связь: '+esc(f.relatedCollection)+' · демонстрационная заглушка</div>':'';return '<div class="field '+(full?'full':'')+' '+(locked?'readonly':'')+'"><label>'+esc(titleOf(f))+required+'</label>'+ctl+hint+'</div>'}
function visibleFields(tab){const names=current.tabs[tab]?.fields||[];return names.map(n=>current.fields.find(f=>f.name===n)).filter(Boolean)}
function chooseImage(){const files=current.fields.filter(f=>f.relatedCollection==='directus_files'||/file|image/i.test(f.interface||''));const links=current.fields.filter(f=>f.relatedCollection&&f.relatedCollection!=='directus_files');const context=files.length?`<h2>Связанные файлы</h2>${files.map(f=>`<div class="stat"><small>${esc(f.label)}</small><strong>${esc(displayValue(f)||'Файл не выбран')}</strong></div>`).join('')}<div class="media-placeholder" style="margin-top:12px"><div><span class="symbol">▧</span>Нет изображения<br><small>Нейтральная заглушка</small></div></div>`:`<h2>Контекст записи</h2><div class="side-stats">${links.length?links.map(f=>`<div class="stat"><small>${esc(f.label)}</small><strong>${esc(displayValue(f)||'Не задано')}</strong></div>`).join(''):`<div class="stat"><small>Раздел</small><strong>${esc(current.label)}</strong></div>`}</div>`;return `<div class="media-column"><div class="panel side-card">${context}</div><div class="panel side-card help-card"><strong>Демонстрационный просмотр</strong><br>${esc(current.note||'Значения вымышлены и не сохраняются. Файлы не загружены.')}</div></div>`}
function supportPanel(){const tab=current.tabs[activeTab]?.label;let title='',cols=[],rows=[];if(['home_page','pages'].includes(current.name)&&tab==='Секции'){title='Вложенная коллекция page_sections · только просмотр';cols=['section_type','title','status','is_visible','sort_order'];rows=[{section_type:'hero',title:'Демонстрационный первый экран',status:'draft',is_visible:true,sort_order:1},{section_type:'categories',title:'Демонстрационные категории',status:'draft',is_visible:true,sort_order:2},{section_type:'faq',title:'Демонстрационные вопросы',status:'draft',is_visible:false,sort_order:3}]}else if(current.name==='orders'&&tab==='Состав'){title='Исторический снимок order_items · только просмотр';cols=['title_snapshot','sku_snapshot','brand_snapshot','quantity','unit_price','currency'];rows=[{title_snapshot:'Демонстрационная позиция',sku_snapshot:'DEMO-SKU',brand_snapshot:'Демо',quantity:1,unit_price:'—',currency:'RUB'},{title_snapshot:'Позиция для примера',sku_snapshot:'DEMO-ITEM',brand_snapshot:'Демо',quantity:2,unit_price:'—',currency:'RUB'}]}else if(current.name==='site_settings'&&tab==='Дополнительно'){title='Нативная коллекция lead_forms · только просмотр';cols=['code','title','status','is_active'];rows=[{code:'demo-contact',title:'Демонстрационная форма связи',status:'draft',is_active:true},{code:'demo-product',title:'Демонстрационная форма товара',status:'draft',is_active:false}]}else if(current.name==='seo_work_items'&&tab==='Дополнительно'){title='Коллекция seo_redirects · только просмотр';cols=['old_url','new_url','status_code','is_active'];rows=[{old_url:'/demo-old',new_url:'/demo-new',status_code:301,is_active:true},{old_url:'/demo-legacy',new_url:'/catalog',status_code:302,is_active:false}]}if(!title)return '';const labels={section_type:'Тип секции',title:'Название',status:'Статус',is_visible:'Видимость',sort_order:'Порядок',title_snapshot:'Позиция заказа',sku_snapshot:'SKU снимка',brand_snapshot:'Бренд снимка',quantity:'Количество',unit_price:'Цена снимка',currency:'Валюта',code:'Код формы',is_active:'Активна',old_url:'Старый URL',new_url:'Новый URL',status_code:'Код ответа'};const th=cols.map(k=>'<th>'+labels[k]+'</th>').join(''),tr=rows.map(row=>'<tr>'+cols.map(k=>'<td>'+esc(typeof row[k]==='boolean'?(row[k]?'Да':'Нет'):row[k])+'</td>').join('')+'</tr>').join('');return '<div class="panel readonly-card support-panel"><h3>'+esc(title)+'</h3><div class="table-wrap"><table class="data-table"><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table></div><p class="native-note">Все строки синтетические. Вложенные данные только для просмотра в этом макете.</p></div>'}
function fieldsPanel(){const tab=current.tabs[activeTab]||current.tabs[0],fs=visibleFields(activeTab),support=supportPanel();const content=fs.map(field).join('');const empty=!fs.length&&!support?'<div class="empty-state"><strong>Нет полей</strong>В этой схеме вкладка пуста.</div>':'';return '<div class="panel form-card"><div class="section-head"><h2>'+esc(tab?.label||'Основное')+'</h2><span class="native-note">'+current.fields.length+' полей схемы</span></div>'+(content?'<div class="field-grid">'+content+'</div>':'')+empty+'</div>'+support}
function tabs(){return `<div class="tabs" role="tablist">${current.tabs.map((t,i)=>`<button role="tab" aria-selected="${i===activeTab}" class="tab ${i===activeTab?'active':''}" data-tab="${i}">${esc(t.label)}</button>`).join('')}</div>`}
function detail(){const readonly=current.guarded;return `${tabs()}${notice()}${current.note?`<div class="notice show warn">${esc(current.note)}</div>`:''}<div class="form-layout"><div>${fieldsPanel()}<div class="panel bottom-actions"><span class="save-note">${readonly?'Редактирование отключено до утверждения контракта безопасной записи.':'Демо: значения не уходят в Directus.'}</span><div class="actions"><button class="btn" data-action="cancel">Отменить</button><button class="btn primary" data-action="save" ${readonly||state==='forbidden'?'disabled':''}>Сохранить</button></div></div></div>${chooseImage()}</div>`}
function rowCells(c,i){let fields=c.fields.filter(f=>['title','label','question','equipment_type','name','customer_name','type','status','slug','sku','code','region','severity','created_at','price','location','old_url'].includes(f.name)).slice(0,5);if(!fields.length)fields=c.fields.slice(0,4);const row=c.rows[i]||c.sample;return fields.map((f,j)=>{const v=row[f.name]??displayValue(f);if(f.name==='status')return `<td><span class="badge ${esc(v)}">${esc(v||'draft')}</span></td>`;return `<td class="${j===0?'row-title':''}">${esc(v|| (f.name==='name'||f.name==='customer_name'?'Демонстрационный клиент':f.name==='phone'?'+7••••••••••':'—'))}</td>`}).join('')}
function list(){if(state==='empty')return `${notice()}<div class="panel empty-state"><strong>Пока нет записей</strong>Создайте первую запись, чтобы начать работу.</div>`;return `${notice()}<div class="list-toolbar"><input class="search" placeholder="⌕  Поиск по ${esc(current.label.toLowerCase())}"><div class="actions"><button class="btn small">Фильтр</button><button class="btn small">Сортировка</button><button class="btn primary small" data-action="new" ${current.guarded||state==='forbidden'?'disabled':''}>＋ Создать</button></div></div><div class="panel list-panel"><div class="table-wrap"><table class="data-table"><thead><tr>${current.fields.filter(f=>['title','label','question','equipment_type','name','customer_name','type','status','slug','sku','code','region','severity','created_at','price','location','old_url'].includes(f.name)).slice(0,5).map(f=>`<th>${esc(titleOf(f))}</th>`).join('')}<th></th></tr></thead><tbody>${current.rows.map((r,i)=>`<tr data-row="${i}">${rowCells(current,i)}<td><button class="btn ghost small" data-open="${i}">Открыть →</button></td></tr>`).join('')}</tbody></table></div><div class="list-foot">Показаны 3 демонстрационные записи · Все данные вымышлены</div></div>`}
function seoQueue(){const a=current.sample.current_value_json||'Текущее значение (демо)';const b=current.sample.proposed_value_json||'Предложенное значение (демо)';return `<div class="detail-layout"><div>${tabs()}${notice()}<div class="panel form-card"><h2>${esc(current.tabs[activeTab]?.label||'Задача')}</h2><div class="field-grid">${visibleFields(activeTab).map(field).join('')}</div></div><div class="panel readonly-card"><h3>Текущее и предложенное значение</h3><div class="compare"><div><small>Текущее значение</small><p>${esc(a)}</p></div><div><small>Предложенное значение</small><p>${esc(b)}</p></div></div><p class="native-note">Очередь только для просмотра; переходы состояния и применение патча требуют отдельного контракта.</p></div></div><aside class="panel side-card"><h2>Состояние обработки</h2><div class="side-stats"><div class="stat"><small>Статус</small><strong>${esc(current.sample.status||'—')}</strong></div><div class="stat"><small>Тип</small><strong>${esc(current.sample.type||'—')}</strong></div><div class="stat"><small>Серьёзность</small><strong>${esc(current.sample.severity||'—')}</strong></div></div></aside></div>`}
function app(){const single=current.singleton;return `<div class="shell"><aside class="rail"><div class="brandmark">D</div><div class="rail-icon active">▦</div><div class="rail-icon">⌕</div><div class="rail-icon">◷</div><div class="rail-icon">⚙</div></aside>${nav()}<main class="stage"><header class="topbar"><div class="crumb">Рабочее пространство&nbsp; / &nbsp;${esc(current.label)}${view==='detail'&&!single?' / Запись':''} <span class="native-note">${esc(current.route)}</span></div><div class="top-actions">${view==='detail'&&!current.guarded&&state!=='forbidden'?`<button class="btn primary small" data-action="save">Сохранить</button>${['home_page','pages','products','categories'].includes(current.name)&&current.fields.some(f=>f.name==='status'&&f.choices.includes('published'))?`<button class="btn small" data-action="publish">Опубликовать · демо</button>`:''}`:''}<button class="btn small" id="modeToggle">${mobile?'Версия ПК':'Версия 390 px'}</button><div class="avatar">AD</div></div></header><section class="content"><div class="title-row"><div><p class="eyebrow">${current.singleton?'Одиночная запись':esc(current.group?.replace('group_','')||'раздел')}</p><h1>${view==='list'&&!single?esc(current.label):esc(current.sample.title||current.sample.question||current.sample.company_name||current.label)}</h1><p>${view==='list'?'Список записей с быстрым поиском и фильтрами':`Редактирование · ${esc(current.name)} · демонстрационная запись`}</p></div><div class="actions"><a class="btn small" href="${esc(current.specHref)}" target="_blank" rel="noreferrer">ТЗ ↗</a>${!single&&view==='detail'?`<button class="btn" data-action="back">← К списку</button>`:''}<span class="status-pill"><span class="dot"></span>${esc(current.sample.status||'Настроено')}</span></div></div>${states()}${view==='list'&&!single?list():current.name==='seo_work_items'?seoQueue():detail()}<div class="footer">Коллекция: <code>${esc(current.name)}</code> · <a href="sections/${esc(current.name)}/fields.json" target="_blank">fields.json</a> · <a href="${esc(current.specHref)}" target="_blank">TZ.md</a> · сохранение и публикация только демонстрационные</div></section></main></div>`}
function render(){document.body.classList.toggle('mobile-mode',mobile);$('#app').innerHTML=app();document.querySelectorAll('[data-col]').forEach(el=>el.onclick=()=>{current=DATA.collections.find(c=>c.name===el.dataset.col);location.hash=current.name;view=current.singleton?'detail':'list';activeTab=0;state='normal';render()});document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{activeTab=+el.dataset.tab;render()});document.querySelectorAll('[data-state]').forEach(el=>el.onclick=()=>{state=el.dataset.state;render()});document.querySelectorAll('[data-row]').forEach(el=>el.onclick=()=>{view='detail';activeTab=0;state='normal';render()});document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{view='detail';activeTab=0;state='normal';render()});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{const a=el.dataset.action;if(a==='back')view='list';if(a==='new'){view='detail';state='normal'}if(a==='cancel')state='normal';if(a==='save')state='saved';if(a==='publish')state='published';render()});$('#modeToggle').onclick=()=>{mobile=!mobile;render()};}
window.addEventListener('hashchange',()=>{const c=collectionFromHash();if(c!==current){current=c;view=current.singleton?'detail':'list';activeTab=0;state='normal';render()}});
render();
</script></body></html>
