<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Предложение · Главная страница</title>
  <style>
    :root{font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263238;background:#f2f6fa;font-synthesis:none;--line:#d9e0e6;--muted:#7b8997;--blue:#315e80;--navy:#10253a;--surface:#fff;--soft:#f7f9fb}
    *{box-sizing:border-box}body{margin:0;min-width:320px}.shell{min-height:100vh;display:grid;grid-template-columns:54px 225px minmax(0,1fr);grid-template-rows:54px minmax(calc(100vh - 54px),auto)}
    .rail{grid-row:1/3;background:var(--navy);color:#bdcbd7;display:flex;align-items:center;flex-direction:column;gap:19px;padding:12px 0}.brand{height:26px;color:white;font-size:19px;font-weight:700}.rail-icon{height:25px;width:25px;border:1px solid #718498;border-radius:6px;display:grid;place-items:center;font-size:12px}.rail-icon.active{background:#eaf1f6;color:#18344e;border-color:#eaf1f6}.rail-bottom{margin-top:auto}
    .nav{grid-row:1/3;border-right:1px solid var(--line);background:#f8fafc;padding:15px 13px;display:flex;flex-direction:column}.nav-head{height:38px;display:flex;align-items:center;justify-content:space-between;color:#536171}.nav-head b{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav-link{margin-top:25px;padding:11px 10px;border-radius:5px;color:#697888}.nav-link.sel{background:#e7eef4;color:#294b68;font-weight:600}.nav-foot{margin-top:auto;background:#eef2f6;text-align:center;padding:10px 2px;border-radius:5px;color:#607081;font-size:12px}
    .top{grid-column:3;background:#f8fafc;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;color:#475462}.top span+span{border-left:1px solid var(--line);margin-left:22px;padding-left:22px}
    main{grid-column:3;max-width:1310px;width:100%;margin:0 auto;background:white;padding:27px 25px 36px;min-width:0}.heading{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.heading h1{font-size:26px;font-weight:400;margin:0}.status{border-radius:20px;background:#eaf4ef;color:#3d755a;padding:5px 12px;font-size:12px;font-weight:600}.status.draft{background:#fff2d9;color:#86621b}.status.hidden{background:#edf0f2;color:#596674}.status.unknown{background:#f5eafa;color:#76508d}.mock-flag{margin-left:auto;color:#775b25;background:#fff7e8;border:1px solid #ead7ab;padding:5px 9px;border-radius:5px;font-size:11px;font-weight:600;letter-spacing:.01em}
    .toolbar{display:flex;align-items:center;gap:14px;margin-top:14px;min-height:38px}.toolbar .hint{color:#687887}.primary{border:0;border-radius:5px;background:#315f80;color:white;padding:10px 17px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}.primary:disabled{background:#edf0f2;color:#a5afb8;cursor:default}.toolbar .primary{margin-left:auto}.global-state{color:#536575;font-size:12px}.notice{margin:10px 0 12px;padding:9px 12px;border-left:3px solid #6b8ea7;background:#f5f8fa;color:#596b7a;font-size:12px}
    .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow:auto;scrollbar-width:thin;white-space:nowrap}.tab{display:inline-block;padding:11px 15px 10px;text-decoration:none;color:#778696;border-bottom:2px solid transparent}.tab.current{color:#294e6c;border-color:#315f80;font-weight:600}
    .content{padding-top:18px}.eyebrow{font-size:12px;color:#71808f;margin:3px 0 12px}.layout{display:grid;grid-template-columns:minmax(0,1.14fr) minmax(330px,.86fr);gap:28px;align-items:start}.stack{display:grid;gap:18px}.group-title{font-size:15px;font-weight:600;margin:0 0 4px;color:#3b4c5c}.subtle{color:#82909e;font-size:12px;margin:0 0 12px}.field{display:block;margin:0 0 17px;min-width:0}.field>span{display:block;color:#344656;font-weight:600;font-size:12px;margin-bottom:6px}.field small{display:block;font-weight:400;color:#7c8995;margin-top:5px;line-height:1.4}.input,textarea,select{width:100%;min-height:39px;border:1px solid #cfd7de;border-radius:4px;background:white;color:#2e3d4a;padding:9px 11px;font:inherit;font-size:14px;outline-color:#7596af}.input[readonly]{background:#f5f7f9;color:#657381}.input::placeholder,textarea::placeholder{color:#a0aab3}textarea{resize:vertical;min-height:78px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rule{border:0;border-top:1px solid #e5eaee;margin:4px 0 15px}.media-card{border:1px solid var(--line);border-radius:7px;padding:15px;background:#fff}.media-preview{height:190px;background:#fff;border:1px solid #edf0f2;border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}.media-caption{width:100%;padding:8px 10px;color:white;font-size:11px;background:linear-gradient(transparent,#45515a)}.media-meta{font-size:12px;color:#768491;margin:8px 0 17px}.button-note{padding:10px 12px;background:#f6f8fa;border-radius:4px;color:#697988;font-size:12px;margin-top:-3px}.button-note strong{color:#465969}.disclosure{border:1px solid var(--line);border-radius:6px;padding:0 13px;background:white}.disclosure summary{padding:12px 0;cursor:pointer;font-weight:600;color:#405467;list-style:none}.disclosure summary::-webkit-details-marker{display:none}.disclosure summary:after{content:"＋";float:right;color:#718294}.disclosure[open] summary:after{content:"−"}.disclosure-body{padding:2px 0 8px}.seo-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:28px}.snippet{border:1px solid var(--line);border-radius:7px;padding:16px;background:#fff}.snippet .hint{font-size:12px;color:#71808f;margin:0 0 12px}.snippet .url{font-size:12px;color:#4b7c59}.snippet h3{color:#315d92;font-size:18px;margin:7px 0 2px;font-weight:500}.snippet p{margin:2px 0;color:#788796;font-size:13px}.check{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:4px;padding:10px;width:max-content;color:#4d5e6d}.check input{accent-color:#315f80}
    .empty{border:1px dashed #c9d3dc;border-radius:6px;padding:22px 19px;color:#4e6070;background:#fbfcfd}.empty strong{display:block;color:#405261;font-size:14px;margin-bottom:5px}.empty p{margin:0;color:#768593;font-size:12px}.block-warning{margin-top:13px;padding:10px 12px;background:#f5f8fa;color:#667785;border-radius:4px;font-size:12px}
    .block-layout{display:grid;grid-template-columns:minmax(230px,.72fr) minmax(0,1.28fr);gap:20px}.block-list,.block-editor{border:1px solid var(--line);border-radius:7px;background:#fff;padding:14px}.block-row{width:100%;text-align:left;padding:12px 10px;background:#fff;border:1px solid transparent;border-radius:5px;color:#314656;cursor:pointer;font:inherit}.block-row.selected{background:#f2f6f9;border-color:#d6e0e8}.block-row small{display:block;color:#84919d;margin-top:3px}.type{font-size:11px;color:#738391}.block-editor h3{font-size:17px;margin:0 0 12px;font-weight:500}.state-callout{padding:9px 11px;border-radius:4px;background:#f5f8fa;color:#5d6f7d;font-size:12px;margin:0 0 14px}.state-callout.draft{background:#fff8e9;color:#765d2c}.state-callout.hidden{background:#f3f5f6}.state-callout.unknown{background:#faf5fc;color:#72557f}.editor-actions{display:flex;align-items:center;gap:12px;margin-top:6px}.editor-actions button{margin-left:auto}.secondary{border:1px solid #cbd5dd;background:#fff;color:#4a6071;padding:9px 13px;border-radius:4px;font:600 12px inherit}.item-card{border:1px solid #e0e6eb;border-radius:5px;padding:10px;margin:9px 0}.item-card strong{font-size:12px;color:#536473}.readonly{background:#f4f6f8;border:1px solid #e1e5e9;border-radius:4px;padding:10px;color:#75828e;font-size:12px}.conflict{border:1px solid #d9b968;background:#fffaf0;padding:13px 15px;border-radius:6px;margin:15px 0}.conflict h2{font-size:15px;margin:0 0 5px;color:#624d22}.conflict p{font-size:12px;color:#675b42;margin:4px 0 12px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:10px 0}.compare div{background:white;border:1px solid #eee2c7;padding:9px;border-radius:4px;font-size:12px;color:#52606b}.compare small{display:block;color:#8b7954;margin-bottom:4px}.footer-save{display:flex;justify-content:flex-end;padding-top:20px}.muted-card{border:1px solid var(--line);border-radius:6px;padding:14px;color:#687785;background:#f9fafb}.muted-card h3{margin:0 0 5px;font-size:14px;color:#4d5e6d}.muted-card p{margin:0;font-size:12px}
    @media(max-width:760px){.shell{display:block;min-height:100vh}.rail,.nav{display:none}.top{height:54px;padding:0 15px}.top span+span{margin-left:13px;padding-left:13px}main{padding:18px 16px 28px}.heading{gap:8px}.heading h1{font-size:23px;max-width:100%}.mock-flag{margin-left:0}.toolbar{flex-wrap:wrap;gap:9px}.toolbar .primary{order:2;width:100%;margin:2px 0 0}.global-state{order:1}.toolbar .hint{order:0;width:100%}.notice{font-size:11px}.tabs{margin-right:-16px;padding-right:16px}.tab{padding:11px 12px 10px;font-size:13px}.layout,.seo-layout,.block-layout{grid-template-columns:1fr;gap:12px}.media-card{order:2}.split{grid-template-columns:1fr;gap:0}.content{padding-top:13px}.field{margin-bottom:15px}.media-preview{height:160px}.compare{grid-template-columns:1fr}.block-list{max-height:210px;overflow:auto}.block-editor{padding:12px}.footer-save{padding-top:14px}}
    body{height:100vh;overflow:hidden}.shell{height:100vh;min-height:0;grid-template-rows:54px minmax(0,1fr);background-image:url("./before-hero-desktop.png");background-repeat:no-repeat;background-size:1536px 1024px;background-position:top left}.rail,.nav,.top{background:transparent;border-color:transparent}.rail>*,.nav>*,.top>*{visibility:hidden}main{width:calc(100% - 54px);height:100%;min-height:0;overflow-y:auto;margin-left:0;margin-right:54px;max-width:none}.heading .global-state{margin-left:auto}.heading .primary{flex:none}.notice{margin-top:15px}
    .subtle,.field small,.media-meta,.snippet .hint,.block-row small,.readonly,.tab,.eyebrow{color:#526273}.field>span{font-size:13px}
    @media(max-width:760px){.shell{height:100vh;display:block;background-image:url("./before-hero-mobile.png");background-size:390px 844px}.rail,.nav{display:none}.top{height:110px;display:block}main{width:100%;height:calc(100vh - 110px);margin-right:0;max-width:none;background:#fff;padding-top:18px}.heading .mock-flag{margin-left:0}.heading .global-state{margin-left:0;width:100%}.heading .primary{width:100%;margin:0}.notice{margin-top:10px}.layout,.seo-layout,.block-layout{grid-template-columns:minmax(0,1fr);width:100%;max-width:100%;min-width:0}.layout>*,.seo-layout>*,.block-layout>*{width:100%;max-width:100%;min-width:0}.check{width:auto;max-width:100%;white-space:normal}.check input{flex:0 0 auto}.readonly{overflow-wrap:anywhere}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="Основная навигация"><div class="brand">◆</div><div class="rail-icon">◇</div><div class="rail-icon active">▤</div><div class="rail-icon">♙</div><div class="rail-icon">▱</div><div class="rail-icon">⌁</div><div class="rail-icon rail-bottom">⚙</div></aside>
    <aside class="nav"><div class="nav-head"><b>Universal Commerce CMS</b><span>◧</span></div><div class="nav-link">Обзор</div><div class="nav-link sel">Главная страница</div><div class="nav-link">Товары</div><div class="nav-link">Категории</div><div class="nav-foot">◆ &nbsp; Directus</div></aside>
    <header class="top"><span>☰</span><span>Главная страница</span></header>
    <main id="main"></main>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const view = q.get('view') || 'hero';
    const state = q.get('state') || 'empty';
    const stateMap = {
      draft:{label:'Черновик',cls:'draft',title:'Раздел для примера',type:'Преимущества',msg:'Черновик не отображается на сайте, даже если блок включён.',visible:true},
      published:{label:'Опубликован',cls:'published',title:'Почему выбирают нас',type:'Преимущества',msg:'Опубликован и включён: блок может отображаться после обновления данных и кеша.',visible:true},
      hidden:{label:'Опубликован',cls:'published',title:'Частые вопросы',type:'Ответы на вопросы',msg:'Опубликован, но выключен: блок скрыт на сайте.',visible:false},
      unknown:{label:'Опубликован',cls:'published',title:'Заметки команды',type:'Незнакомый тип',msg:'Сайт может показать общие поля. Специальное оформление этого типа не подтверждено.',visible:true}
    };
    const section = stateMap[state] || stateMap.published;
    const stateNames={draft:'Черновик',published:'Опубликован',hidden:'Опубликован · скрыт',unknown:'Неизвестный тип'};
    const tabs=[['hero','Первый экран'],['blocks','Блоки страницы'],['search','Поиск и ссылки'],['other','Дополнительно']];
    const tabLinks=tabs.map(([id,label])=>`<a class="tab ${view===id?'current':''}" href="?view=${id}${id==='blocks'&&state!=='empty'?'&state='+state:''}">${label}</a>`).join('');
    const input=(label,value='',help='',kind='input')=>`<label class="field"><span>${label}</span>${kind==='textarea'?`<textarea>${value}</textarea>`:`<input class="input" ${value!==''?`value="${value}"`:''}>`}${help?`<small>${help}</small>`:''}</label>`;
    function hero(){return `<div class="layout"><section><h2 class="group-title">Текст первого экрана</h2><p class="subtle">Эти поля формируют заголовок и пояснение, которые увидит посетитель.</p>${input('Заголовок на первом экране','Synthetic parts catalog')}${input('Текст первого экрана','Neutral local integration content.','', 'textarea')}<hr class="rule"><h2 class="group-title">Кнопки первого экрана</h2><div class="split">${input('Текст основной кнопки')}${input('Ссылка основной кнопки')}${input('Текст второй кнопки')}${input('Ссылка второй кнопки')}</div><p class="button-note"><strong>Условие показа:</strong> текст и допустимая ссылка должны быть заполнены вместе. Если подпись пустая или ссылка неверна/пуста, сайт использует стандартную кнопку. Очистка поля сама по себе кнопку не скрывает.</p></section><section class="media-card"><h2 class="group-title">Изображение первого экрана</h2><p class="subtle">Выбранный файл</p><div class="media-preview"><div class="media-caption">Generated synthetic acceptance fixture</div></div><p class="media-meta">Предпросмотр текущего изображения · 1 × 1 px</p>${input('Описание изображения','Generated synthetic test image','Текст для посетителей, которые не видят изображение.')}</section></div>`}
    function search(){return `<div class="seo-layout"><section><h2 class="group-title">Настройки поиска</h2><p class="subtle">Заголовок и описание используются в метаданных главной страницы и передаются в поисковые представления.</p>${input('Заголовок для поиска')} ${input('Описание для поиска','','','textarea')}<details class="disclosure" open><summary>Поиск в шапке сайта</summary><div class="disclosure-body"><p class="subtle">Эти два значения действительно задают подсказку в строке поиска и подпись кнопки в шапке.</p>${input('Подсказка в строке поиска','Enter a synthetic part number')}${input('Текст кнопки поиска','Search')}</div></details><div style="height:14px"></div><details class="disclosure"><summary>Основной адрес страницы</summary><div class="disclosure-body">${input('Основной адрес страницы')}</div></details><div style="height:12px"></div><label class="field"><span>Индексация</span><span class="check"><input type="checkbox" checked> Разрешить поисковым системам показывать страницу</span></label><details class="disclosure"><summary>Резервный заголовок для поиска</summary><div class="disclosure-body">${input('Резервный заголовок для поиска','Synthetic acceptance home','Используется как запасное значение метаданных. Не отображается в первом экране.')}</div></details><p class="subtle">Карточка при отправке ссылки использует эти заголовок и описание вместе с изображением первого экрана.</p></section><aside class="snippet"><p class="hint">Локальный пример сниппета · не фактическая выдача</p><span class="url">Адрес главной страницы</span><h3>Synthetic acceptance home</h3><p>Neutral local integration content.</p></aside></div>`}
    function blocks(){if(state==='empty')return `<section class="empty"><strong>На этой странице пока нет редактируемых блоков</strong><p>Бренды, категории и товары сайта не управляются на этой вкладке.</p></section><p class="block-warning">Здесь появятся только существующие блоки главной страницы. Новые страницы или блоки из этого экрана не создаются.</p>`;
      const others=Object.keys(stateMap).filter(s=>s!==state).map(s=>`<a href="?view=blocks&state=${s}" style="color:#426985;margin-right:12px;font-size:11px">${stateNames[s]}</a>`).join('');
      return `<p class="eyebrow">Пример состояния · макет, такой записи сейчас нет</p><div style="margin:0 0 11px">Состояния для просмотра: ${others}</div><div class="block-layout"><section class="block-list"><h2 class="group-title">Блоки главной страницы</h2><button class="block-row selected"><b>${section.title}</b><small>${section.type} · ${section.label} · ${section.visible?'Показывать':'Скрыт'}</small></button><button class="block-row"><b>Ещё один пример</b><small>Текст · Опубликован · Показывать</small></button></section><section class="block-editor"><div class="heading" style="margin-bottom:10px"><h3>${section.title}</h3><span class="status ${section.cls}">${section.label}</span><span class="mock-flag" style="margin-left:auto">Пример · не запись БД</span></div><div class="editor-actions"><span class="subtle">Сохранение действует только для этого блока.</span><button class="primary">Сохранить блок</button></div><p class="state-callout ${state==='draft'?'draft':state==='hidden'?'hidden':state==='unknown'?'unknown':''}">${section.msg}</p>${input('Название блока',section.title)}<label class="field"><span>Тип блока</span><input class="input" value="${section.type}" readonly><small>Тип показан понятным названием и здесь не меняется.</small></label>${input('Текст блока','Описание содержимого блока.','', 'textarea')}<label class="check"><input type="checkbox" ${section.visible?'checked':''}> Показывать блок на сайте</label><hr class="rule"><h4 class="group-title">Элементы</h4><div class="readonly">Элементы сохранены. Удобный редактор в этой установке не настроен; здесь доступен просмотр.</div><div class="item-card" style="background:#f8fafb"><strong>Пример элемента · только макет</strong><p><b>Заголовок:</b> Синтетическая запчасть</p><p><b>Текст:</b> Нейтральное тестовое описание элемента.</p><p><b>Ссылка:</b> /example-item</p></div><div style="height:12px"></div><div class="readonly"><b>Дополнительные настройки</b><br>Не используются текущим отображением сайта. Содержимое сохранено без ручного редактирования.</div></section></div>`}
    function other(){return `<div class="layout"><section><h2 class="group-title">Сохранённые значения</h2><p class="subtle">Сохранённые значения показаны только для чтения: текущий сайт их не использует.</p><details class="disclosure"><summary>Поиск в шапке сайта</summary><div class="disclosure-body"><label class="field"><span>Подпись поля поиска</span><input class="input" value="Search synthetic parts" readonly></label><p class="subtle">Текущая шапка использует подсказку и текст кнопки из вкладки «Поиск и ссылки».</p></div></details><div style="height:10px"></div><details class="disclosure"><summary>Ссылки на список</summary><div class="disclosure-body"><label class="field"><span>Подсказка запроса</span><input class="input" value="Looking for several synthetic items?" readonly></label><label class="field"><span>Подпись ссылки</span><input class="input" value="Send a request" readonly></label><label class="field"><span>Адрес ссылки</span><input class="input" value="/request" readonly></label></div></details><div style="height:10px"></div><details class="disclosure"><summary>Ссылки на таблицу и фотографии</summary><div class="disclosure-body"><label class="field"><span>Подпись ссылки на таблицу</span><input class="input" value="Request a spreadsheet lookup" readonly></label><label class="field"><span>Адрес таблицы</span><input class="input" value="/request?source=spreadsheet" readonly></label><label class="field"><span>Подпись ссылки на фотографии</span><input class="input" value="Request by photo" readonly></label><label class="field"><span>Адрес фотографий</span><input class="input" value="/request?source=photo" readonly></label><p class="subtle">Сейчас публичная главная не читает эти ссылки.</p></div></details><div style="height:10px"></div><details class="disclosure"><summary>Данные для карточки при отправке ссылки</summary><div class="disclosure-body"><label class="field"><span>Заголовок карточки</span><input class="input" value="Пусто" readonly></label><label class="field"><span>Описание карточки</span><input class="input" value="Пусто" readonly></label><label class="field"><span>Изображение карточки</span><input class="input" value="Не выбрано" readonly></label><p class="subtle">Отдельные сохранённые заголовок, описание и изображение для ссылки не используются публичной главной. Карточка формируется из поисковых заголовка и описания, а также изображения первого экрана.</p></div></details><div style="height:10px"></div><details class="disclosure"><summary>Переводы</summary><div class="disclosure-body"><label class="field"><span>Сохранённые переводы</span><input class="input" value="Пусто" readonly></label><p class="subtle">Переводы сохраняются, но их применение на главной не подтверждено. Содержимое не раскрывается в виде технических данных.</p></div></details></section><section><h2 class="group-title">Служебные сведения</h2><label class="field"><span>Состояние страницы</span><input class="input" value="Опубликована" readonly></label><label class="field"><span>Идентификатор</span><input class="input" value="Только для чтения" readonly></label><label class="field"><span>Изменена</span><input class="input" value="Только для чтения" readonly></label></section></div>`}
    function conflict(){return `<div class="layout"><section><h2 class="group-title">Первый экран</h2>${input('Заголовок на первом экране','Мой несохранённый текст')}<div class="conflict"><h2>Блок сохранён. В главной остались несохранённые изменения.</h2><p>Текущий заголовок страницы уже показан рядом с вашим вводом для сравнения.</p><div class="compare"><div><small>На сервере сейчас · Заголовок на первом экране</small>Synthetic parts catalog</div><div><small>Ваш ввод · Заголовок на первом экране</small>Мой несохранённый текст</div></div><button class="secondary" type="button">Обновить и оставить мои изменения</button><p style="margin-top:9px">Обновление оставит ваш ввод в форме, но не сохранит главную.</p></div></section><aside class="muted-card"><h3>Отдельное сохранение</h3><p>Блоки имеют собственную кнопку сохранения и собственную проверку актуальности.</p></aside></div>`}
    const names={hero:'Первый экран',blocks:'Блоки страницы',search:'Поиск и ссылки',other:'Дополнительно',conflict:'Первый экран'};
    const body=view==='blocks'?blocks():view==='search'?search():view==='other'?other():view==='conflict'?conflict():hero();
    const dirtySummary=view==='conflict'?'В главной есть несохранённые изменения':view==='blocks'&&state!=='empty'?'В главной и 2 блоках есть несохранённые изменения':'Нет несохранённых изменений';
    const parentSaveDisabled=view==='conflict'||state==='empty'?'disabled':'';
    document.querySelector('#main').innerHTML=`<div class="heading"><h1>Главная страница</h1><span class="status">Опубликована</span><span class="mock-flag">Макет · не установлен</span><span class="global-state">${dirtySummary}</span><button class="primary" ${parentSaveDisabled}>Сохранить главную</button></div><div class="notice">Сохранение меняет текущую опубликованную главную. Изменения появятся на сайте после обновления данных и кеша. Каждый блок сохраняется отдельно.</div><nav class="tabs" aria-label="Разделы главной">${tabLinks}</nav><div class="content"><p class="eyebrow">${view==='conflict'?'Состояние сравнения · предложение':`Раздел: ${names[view]||names.hero}`}</p>${body}</div>`;
    document.querySelectorAll('input:not([type=checkbox]):not([readonly]), textarea').forEach(el=>el.addEventListener('input',()=>{document.querySelector('.global-state').textContent='Есть несохранённые изменения';if(view!=='conflict')document.querySelectorAll('.primary').forEach(b=>b.disabled=false)}));
  </script>
</body>
