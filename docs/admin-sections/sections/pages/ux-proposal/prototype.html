const sampleBase='http://127.0.0.1:3000';
const rows=[['Demonstration page','demo-page','standard','draft','—'],['Synthetic acceptance page','acceptance-83c74e34-content-page','standard','published','07.10.2026'],[page.title,page.slug,'standard','published','07.10.2026']];

let returnToList='?view=list';function q(){return new URLSearchParams(location.search)}function view(){return q().get('view')||'main'}function state(){return q().get('state')||'configured'}

function isDraft(){return state()==='draft'}function isFallback(){return state()==='fallback'}function configured(){return state()!=='unconfigured'}function savedUrl(){return configured()?`${sampleBase}/${page.slug}`:''}function statusLabel(status=null){const value=status??(isDraft()?'draft':page.status);return value==='draft'?'Черновик':value==='archived'?'В архиве':'Опубликована'}

function header(v){const title=v==='new'?'Новая страница':v==='list'?'Страницы':page.title;const publishedNotice=isDraft()?'Черновик ещё не опубликован. Сохранение не публикует страницу.':isFallback()?'Сохранение опубликованной страницы может обновить её содержимое. Для встроенного адреса после снятия записи с публикации встроенная страница может остаться доступной.':'Сохранение опубликованной страницы может обновить содержимое на сайте с небольшой задержкой. Публикация меняется отдельно. Блоки сохраняются отдельно.';return `${v!=='list'?'<a class="back-list" href="?view=list" data-action="back-list">‹ Все страницы</a>':''}<div class="ribbon">Предлагаемый вид · макет, не установлен</div><div class="toolbar"><h1>${title}</h1>${v==='new'?'<span class="status draft">Черновик</span>':v!=='list'?`<span class="status ${isDraft()?'draft':''}">${statusLabel()}</span>`:''}<span class="grow"></span><span class="muted global" id="dirty">Нет несохранённых изменений</span>${v==='list'?`<button class="button primary" data-go="new">Создать страницу</button>`:v==='new'?`<button class="button primary" data-action="save-new">Создать черновик</button>`:`<button class="button primary" id="savePage" data-action="save" disabled>Сохранить страницу</button>`}</div>${v!=='list'?`${v!=='new'?`<div class="notice">${publishedNotice}</div>`:''}${tabs(v)}`:''}`}function context(){const url=savedUrl();const ready=Boolean(url)&&!isDraft();const stateLine=isDraft()?'<p class="muted">Черновик ещё не опубликован. Сохранение не публикует страницу.</p>':isFallback()?'<p class="muted">Встроенная страница может остаться доступной после снятия записи с публикации.</p>':'';return `<aside class="rightcol"><section class="card"><h2>Страница на сайте</h2><dl><div class="row"><dt>Публикация</dt><dd><span class="status ${isDraft()?'draft':''}">${statusLabel()}</span></dd></div></dl><div class="context-url">${url||'/'+page.slug}</div>${url?'<p class="site-sample">Предложенный пример базы: http://127.0.0.1:3000 · не установлено</p>':'<div class="emptycfg">Адрес сайта пока не настроен, поэтому полный адрес страницы неизвестен.</div>'}<button class="button ${ready?'':'linkoff'}" data-action="open-public" ${ready?'':'disabled aria-disabled="true"'}>Открыть страницу на сайте</button>${isDraft()?'<p class="muted">Ссылка станет доступна после публикации.</p>':''} <button class="button" data-go="status">Изменить публикацию</button>${stateLine}</section><section class="card"><h2>Порядок содержимого</h2><div style="font-weight:600">${page.h1||'Заголовок для посетителя'}</div><p class="muted">Вводный текст, блоки страницы, затем текст внизу страницы.</p></section></aside>`}function mainView(){return `<div class="cols"><section class="leftcol"><div class="section"><h2>Название и адрес</h2><p class="help">Название помогает найти страницу в списке. Заголовок для посетителя задаётся отдельно.</p>${field('Название для списка',page.title,'Понятное название для команды.')}${field('Адрес страницы',page.slug,'Часть адреса после домена сайта.')}${pageTypeField()}</div><hr class="group-rule"><div class="section"><h2>Содержимое</h2>${field('Заголовок для посетителя',page.h1,'Отображается в верхней части страницы.')}${field('Вводный текст',page.intro,'Короткий текст перед блоками страницы.','textarea')}${field('Текст внизу страницы',page.bottom,'Показывается после блоков страницы.','textarea')}<details class="disclosure"><summary>Надзаголовок</summary><div class="disclosure-body">${field('Надзаголовок','','Короткая строка над заголовком.')}</div></details></div></section>${context()}</div>`}
function searchView(){const url=savedUrl();const title=page.seoTitle||page.title;const desc=page.seoDescription||page.intro||'';const ready=Boolean(url)&&!isDraft();return `<div class="cols"><section class="leftcol"><div class="section"><h2>Поиск и ссылки</h2><p class="help">Заголовок и описание помогают представить страницу в поиске и при отправке ссылки.</p>${field('Заголовок в поиске',page.seoTitle,'Если поле пустое, используется название для списка.')}${field('Описание в поиске',page.seoDescription,'Если поле пустое, используется вводный текст.','textarea')}<label class="check"><input type="checkbox" data-edit="1" checked> Показывать в поисковых системах</label><div style="height:14px"></div><label class="field"><span>Изображение для ссылки</span><select data-edit="1"><option>Не выбрано</option><option>Выбрать изображение…</option></select><small>Выбранное изображение используется в карточке ссылки на страницу.</small></label><details class="disclosure"><summary>Основной адрес для поиска</summary><div class="disclosure-body">${field('Основной адрес для поиска','','Оставьте поле пустым, чтобы использовать адрес страницы.')}</div></details></div></section><aside class="rightcol"><section class="card"><h2>Пример оформления</h2><div class="snippet"><p class="hint">Пример оформления, не поисковая выдача</p><span class="url">${url||'/'+page.slug}</span><h3>${title}</h3><p>${desc}</p></div></section><section class="card"><h2>Адрес для посетителей</h2><div class="context-url">${url||'/'+page.slug}</div>${url?'<p class="site-sample">Предложенный пример базы: http://127.0.0.1:3000 · не установлено</p>':'<div class="emptycfg">Адрес сайта пока не настроен.</div>'}<button class="button ${ready?'':'linkoff'}" data-action="open-public" ${ready?'':'disabled aria-disabled="true"'}>Открыть страницу на сайте</button>${isDraft()?'<p class="muted">Черновик ещё не опубликован.</p>':''}</section></aside></div>`}function listControls(){const searchValue=q().get('q')||(state()==='no-results'?'несуществующая страница':'');return `<form class="filter-tools list-controls" id="listSearch"><input class="input list-search" id="query" aria-label="Поиск страниц" placeholder="Найти по названию, адресу или H1" value="${searchValue}"><select class="list-status" aria-label="Статус"><option>Все статусы</option><option>Опубликована</option><option>Черновик</option><option value="archived">В архиве</option></select><details class="list-filters"><summary>Фильтры</summary><div class="filter-panel"><label class="field"><span>Тип страницы</span><select><option>Все типы</option>${Object.values(typeLabels).map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field"><span>Индексация</span><select><option>Любая</option><option>Разрешена</option><option>Запрещена</option></select></label><button class="button" type="button" data-action="apply-filters">Применить</button></div></details><select class="list-sort" aria-label="Сортировка"><option>Изменённые недавно</option><option>Изменённые давно</option><option>Название: А–Я</option><option>Название: Я–А</option><option>Адрес: А–Я</option><option>Адрес: Я–А</option></select></form>`}
function listView(){const s=q().get('state');let result;if(s==='empty')result=`<div class="empty-state list-empty"><h2>Страниц пока нет</h2><p>Начните с названия и адреса страницы.</p><button class="button primary" data-go="new">Создать страницу</button></div>`;else if(s==='no-results')result=`<div class="empty-state list-empty"><h2>Страницы не найдены</h2><p>Измените запрос или сбросьте фильтры.</p><button class="button" data-action="reset">Сбросить поиск и фильтры</button></div>`;else result=`<div class="table-wrap"><table class="table"><thead><tr><th>Название и адрес</th><th class="hide-mobile">Тип страницы</th><th>Статус</th><th class="hide-mobile">Изменено</th></tr></thead><tbody>${rows.map(r=>`<tr data-open-row><td class="list-titlecell"><a href="?view=main">${r[0]}</a><small>/${r[1]}</small></td><td class="hide-mobile">${typeLabels[r[2]]}</td><td><span class="status ${r[3]==='draft'?'draft':''}">${statusLabel(r[3])}</span></td><td class="hide-mobile">${r[4]}</td></tr>`).join('')}</tbody></table></div><div class="pagination"><span>1–3 из 3 · по 25 на странице</span><span><button class="button" disabled aria-label="Предыдущая страница">‹</button>　1　<button class="button" disabled aria-label="Следующая страница">›</button></span></div>`;return `<div class="controls">${listControls()}</div>${result}`}function newView(){return `<div class="cols"><section class="leftcol"><div class="section"><h2>Название и адрес</h2><p class="help">Название для команды и адрес страницы можно изменить отдельно.</p>${field('Название для списка *','Доставка и оплата','','input','data-new-title')}${field('Адрес страницы *','dostavka-i-oplata','Адрес создан русско-латинской транслитерацией. Можно изменить вручную; после сохранения адрес хранится отдельно от названия.','input','data-new-slug')}${field('Тип страницы','Обычная страница','Новая страница создаётся как обычная. Тип изменить нельзя.','input','readonly')}</div><hr class="group-rule"><div class="section"><h2>Содержимое</h2>${field('Заголовок для посетителя *','','Заполните отдельно. Название страницы не копируется автоматически.')}${field('Вводный текст','','','textarea')}${field('Текст внизу страницы','','','textarea')}<details class="disclosure"><summary>Надзаголовок</summary><div class="disclosure-body">${field('Надзаголовок')}</div></details></div></section><aside class="rightcol"><div class="emptycfg">Адрес сайта пока не настроен. Публичную ссылку можно будет составить после настройки адреса сайта.</div><div class="context-url">/dostavka-i-oplata</div></aside></div>`}function blocksView(){return `<section><h2>Блоки страницы</h2><div class="block-layout"><section class="block-list"><button class="block-row selected"><span class="block-index">01</span><span class="block-info"><b>Fixture section</b><small>Тип: Тип блока не распознан · Статус: Опубликована · Порядок: 1</small></span><span class="block-enabled">Включён</span></button></section><section class="block-editor"><div class="block-head"><h3>Fixture section</h3><span class="muted">Нет несохранённых изменений</span><button class="button primary" disabled>Сохранить блок</button></div><nav class="block-tabs" role="tablist" aria-label="Поля блока">${['Содержимое','Основное','Кнопка','Элементы','Дополнительно'].map((n,i)=>`<button role="tab" aria-selected="${i===0?'true':'false'}" data-block-tab="${i}" class="${i===0?'active':''}" type="button">${n}</button>`).join('')}</nav><div role="tabpanel" class="block-pane" data-block-pane="0">${field('Заголовок блока','Fixture section','','input','readonly')}${field('Текст','Synthetic acceptance content.','','textarea','readonly')}${field('Подзаголовок','','','input','readonly')}<label class="field"><span>Изображение</span><div class="block-image-empty">Изображение не выбрано</div></label>${field('Описание изображения','','','input','readonly')}</div><div role="tabpanel" class="block-pane" data-block-pane="1" hidden>${field('Тип блока','Тип блока не распознан','','input','readonly')}${field('Публикация','Опубликован','','input','readonly')}${field('Порядок','1','','input','readonly')}<label class="check"><input type="checkbox" checked disabled> Показывать блок на сайте</label></div><div role="tabpanel" class="block-pane" data-block-pane="2" hidden>${field('Подпись кнопки','','','input','readonly')}${field('Адрес кнопки','','','input','readonly')}</div><div role="tabpanel" class="block-pane" data-block-pane="3" hidden><p class="help">Сведения элементов для этого типа блока недоступны.</p></div><div role="tabpanel" class="block-pane" data-block-pane="4" hidden><p class="help">Сохранённые дополнительные сведения доступны только для чтения.</p></div></section></div><p class="help">Изменения содержимого страницы и блока сохраняются отдельно.</p></section>`}function statusView(){return `<div class="modal-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="statusTitle"><h2 id="statusTitle">Изменить публикацию страницы</h2><p>Публикация управляет доступностью страницы на сайте. Изменение статуса страницы не меняет статусы её блоков.</p><label class="field"><span>Состояние</span><select data-status-select data-current="published"><option value="published" ${isDraft()?'':'selected'}>Опубликована</option><option value="draft" ${isDraft()?'selected':''}>Черновик</option><option>В архиве</option></select></label>${isFallback()?'<div class="emptycfg">Для встроенного адреса после снятия записи с публикации встроенная страница может остаться доступной.</div>':'<p>При переводе страницы в черновик её сохранённый адрес перестанет открывать страницу на сайте.</p>'}<p><button class="button" data-go="main">Отмена</button> <button class="button primary" data-action="status" data-status-confirm disabled>Подтвердить изменение</button></p></section></div>`}function conflictView(){return `<div class="cols"><section><h2>Изменения страницы</h2><div class="emptycfg">Страница изменилась, пока вы редактировали её. Сравните значения, затем обновите данные или оставьте свой ввод.</div><div class="subline"><div class="card"><b>Сейчас сохранено</b><p>${page.h1}</p></div><div class="card"><b>Ваш ввод</b><p>Мой заголовок страницы</p></div></div><button class="button" data-action="keep">Обновить и оставить мой ввод</button></section>${context()}</div>`}
function content(v){if(v==='main')return mainView();if(v==='search')return searchView();if(v==='list')return listView();if(v==='new')return newView();if(v==='blocks')return blocksView();if(v==='status')return `${mainView()}${statusView()}`;if(v==='conflict')return conflictView();return `<div class="cols"><section><h2>Дополнительные сведения</h2><p class="help">Служебные сведения доступны только для просмотра.</p>${field('Идентификатор','Только для чтения','','input','readonly')}${field('Дата изменения','Только для чтения','','input','readonly')}</section>${context()}</div>`}
function render(){const v=view();document.querySelector('#top-title').textContent=v==='list'?'Страницы':v==='new'?'Новая страница':page.title;document.querySelector('#app').innerHTML=header(v)+`<div class="content">${content(v)}</div><p class="bottom">Макет интерфейса. Все действия синтетические; запросы к Directus и сайту не выполняются.</p>`;const save=document.querySelector('#savePage');if(save)save.disabled=true;}
function transliterate(value){const map={а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"yo",ж:"zh",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"ts",ч:"ch",ш:"sh",щ:"shch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya"};return value.toLowerCase().split("").map(ch=>map[ch]??ch).join("").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2400)}
document.addEventListener('change',e=>{if(e.target.matches('[data-status-select]')){const b=document.querySelector('[data-status-confirm]');if(b)b.disabled=e.target.value===e.target.dataset.current}});document.addEventListener('click',e=>{const bt=e.target.closest('[data-block-tab]');if(bt){const pane=bt.dataset.blockTab;document.querySelectorAll('[data-block-tab]').forEach(x=>{x.classList.toggle('active',x===bt);x.setAttribute('aria-selected',x===bt?'true':'false')});document.querySelectorAll('[data-block-pane]').forEach(x=>x.hidden=x.dataset.blockPane!==pane);return}const row=e.target.closest('#app [data-open-row]');if(row){e.preventDefault();returnToList=location.search||'?view=list';go('main');return}const a=e.target.closest('[data-view]');if(a){e.preventDefault();go(a.dataset.view);return}const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}const b=e.target.closest('[data-action]');if(b){const act=b.dataset.action;if(act==='back-list'){history.pushState({},'',returnToList);render();return}if(act==='save'){document.querySelector('#dirty').textContent='Нет несохранённых изменений';b.disabled=true;toast('Макет: изменения страницы сохранены локально. Статус публикации не изменён.')}if(act==='save-new')toast('Макет: создан черновик. Данные не отправлены.');if(act==='status')toast('Макет: публикация не изменена.');if(act==='keep')toast('Макет: введённый текст оставлен для сравнения.');if(act==='open-public')toast(`Макет: публичный адрес ${savedUrl()} (переход не выполняется).`);if(act==='reset')go('list','',{q:''});if(act==='apply-filters')toast('Макет: фильтры применены.');return}});
document.addEventListener('input',e=>{if(e.target.matches('[data-new-title]')){const slug=document.querySelector('[data-new-slug]');if(slug&&!slug.dataset.touched)slug.value=transliterate(e.target.value)}if(e.target.matches('[data-new-slug]'))e.target.dataset.touched='true';if(e.target.closest('#listSearch'))return;if(e.target.matches('[data-edit]')){const d=document.querySelector('#dirty');if(d)d.textContent='Есть несохранённые изменения';const save=document.querySelector('#savePage');if(save)save.disabled=false}});document.addEventListener('change',e=>{if(e.target.matches('input[type=checkbox][data-edit],select[data-edit]')){const d=document.querySelector('#dirty');if(d)d.textContent='Есть несохранённые изменения';const save=document.querySelector('#savePage');if(save)save.disabled=false}});document.addEventListener('submit',e=>{if(e.target.id==='listSearch'){e.preventDefault();const value=document.querySelector('#query').value.trim();go('list',value?'no-results':'',value?{q:value}:{q:''})}});window.addEventListener('popstate',render);render();
</script></body></html>
